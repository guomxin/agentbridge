[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agentbridge-pi-host"
version = "0.1.1"
requires-python = ">=3.12"
dependencies = ["mcp==1.23.2", "uvicorn==0.51.0", "aiohttp==3.14.5", "pypdf==6.21.4", "Pillow==13.0.0"]

[project.scripts]
agentbridge-pi-host = "pi_agentbridge.server:main"

[tool.setuptools]
packages = ["pi_agentbridge"]

[tool.setuptools.package-data]
pi_agentbridge = ["worker.mjs"]
