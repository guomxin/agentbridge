[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agentbridge"
version = "0.2.0"
description = "Agent-oriented command capabilities for legacy B/S systems"
requires-python = ">=3.12"
classifiers = [
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: POSIX :: Linux",
]
dependencies = [
  "cryptography==49.0.0",
  "mcp==1.23.2",
  "uvicorn==0.51.0",
  "playwright==1.60.0",
]

[project.scripts]
agentbridge = "agentbridge.cli.main:main"
bscli = "bscli.cli.main:main"

[project.optional-dependencies]
postgresql = ["psycopg[binary]==3.3.5"]
database-analysis = ["psycopg[binary]==3.3.5", "pglast==7.18"]

[tool.setuptools.packages.find]
include = ["agentbridge*", "bscli", "bscli.cli"]

[tool.setuptools.package-data]
"agentbridge.business_skills" = ["*/manifest.json", "*/SKILL.md", "*/references/*.md"]
"agentbridge.core" = ["user_permission_catalog.json"]
"agentbridge.adapters" = ["seeyon_page_scripts/*.js"]
"agentbridge.mcp" = ["static/*.html"]
"agentbridge.admin" = ["static/*.html", "static/*.css", "static/*.js", "static/*.mjs", "static/*.svg", "static/*LICENSE.txt"]
"agentbridge.workspace" = ["static/*.html", "static/*.css", "static/*.js", "static/*.mjs", "static/vendor/*", "*.mjs"]

[tool.setuptools.data-files]
"share/agentbridge/schemas/agent-host/v1" = ["schemas/agent-host/v1/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
