[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cli-helper"
version = "0.1.0"
description = "Agent-oriented command capabilities for legacy B/S systems"
requires-python = ">=3.12"
dependencies = [
  "cryptography==49.0.0",
  "mcp==1.23.2",
  "uvicorn==0.51.0",
  "playwright==1.60.0",
]

[project.scripts]
bscli = "bscli.cli.main:main"

[project.optional-dependencies]
postgresql = ["psycopg[binary]==3.3.5"]
database-analysis = ["psycopg[binary]==3.3.5", "pglast==7.18"]

[tool.setuptools.packages.find]
include = ["bscli*"]

[tool.setuptools.package-data]
"bscli.business_skills" = ["*/manifest.json", "*/SKILL.md", "*/references/*.md"]
"bscli.core" = ["user_permission_catalog.json"]
"bscli.adapters" = ["seeyon_page_scripts/*.js"]
"bscli.mcp" = ["static/*.html"]
"bscli.admin" = ["static/*.html", "static/*.css", "static/*.js", "static/*.mjs", "static/*.svg", "static/*LICENSE.txt"]
"bscli.workspace" = ["static/*.html", "static/*.css", "static/*.js", "static/*.mjs", "static/vendor/*", "*.mjs"]

[tool.setuptools.data-files]
"share/agentbridge/schemas/agent-host/v1" = ["schemas/agent-host/v1/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
