name: Repository validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validation:
    name: repository-validation
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Select validation scope from verified history
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/ci_validation_plan.py
      - uses: actions/setup-node@v4
        if: steps.plan.outputs.profile != 'docs' && steps.plan.outputs.profile != 'python-tests'
        with:
          node-version: '22.22.3'
      - name: Prepare Python validation environment
        if: steps.plan.outputs.profile != 'node-tests'
        env:
          VALIDATION_PROFILE: ${{ steps.plan.outputs.profile }}
        run: |
          set -euo pipefail
          validation_venv="$RUNNER_TEMP/agentbridge-tests"
          python -m venv "$validation_venv"
          test_packages=('setuptools>=77' pytest)
          project_spec=.
          if [[ "$VALIDATION_PROFILE" == full ]]; then
            test_packages+=(pytest-xdist)
            project_spec='.[database-analysis]'
          fi
          "$validation_venv/bin/python" -m pip install --disable-pip-version-check "${test_packages[@]}"
          "$validation_venv/bin/python" -m pip install --disable-pip-version-check --no-build-isolation -e "$project_spec"
          echo "AGENTBRIDGE_TEST_PYTHON=$validation_venv/bin/python" >> "$GITHUB_ENV"
      - name: Run independent repository checks without a browser
        env:
          VALIDATION_PROFILE: ${{ steps.plan.outputs.profile }}
        run: |
          set -euo pipefail
          "${AGENTBRIDGE_TEST_PYTHON:-python}" scripts/ci_validation.py --profile "$VALIDATION_PROFILE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-validation-${{ github.sha }}
          path: |
            output/ci-validation/ci-plan.json
            output/ci-validation/*.xml
            output/ci-validation/runs/*/artifact/artifact.json
          retention-days: 14
