name: Repository validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validation:
    name: repository-validation
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Select validation scope from verified history
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/ci_validation_plan.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
      - name: Prepare Python validation environment
        run: |
          set -euo pipefail
          validation_venv="$RUNNER_TEMP/agentbridge-tests"
          python -m venv "$validation_venv"
          "$validation_venv/bin/python" -m pip install --disable-pip-version-check 'setuptools>=77' pytest pytest-xdist
          "$validation_venv/bin/python" -m pip install --disable-pip-version-check --no-build-isolation -e '.[database-analysis]'
          echo "AGENTBRIDGE_TEST_PYTHON=$validation_venv/bin/python" >> "$GITHUB_ENV"
      - name: Prepare Linux browser dependencies for full validation
        if: steps.plan.outputs.profile == 'full'
        run: |
          set -euo pipefail
          "$AGENTBRIDGE_TEST_PYTHON" -m playwright install --with-deps chromium
      - name: Validate repository revision without production credentials
        env:
          VALIDATION_PROFILE: ${{ steps.plan.outputs.profile }}
        run: |
          set -euo pipefail
          "$AGENTBRIDGE_TEST_PYTHON" scripts/ci_validation.py --profile "$VALIDATION_PROFILE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-${{ github.sha }}
          path: output/release-validation/
          retention-days: 14
